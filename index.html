<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cahier de comptes</title>
<style>
body{font:16px/1.4 system-ui,sans-serif;margin:0;padding:14px;max-width:760px;margin:auto;color:#17202e;background:#fff}
h1{font-size:1.3rem;margin:0 0 4px}
.info{margin:0 0 12px;line-height:1.7}
input{padding:10px;border:1px solid #bbb;border-radius:6px;font:inherit;width:100%;margin-bottom:8px;box-sizing:border-box}
.b{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button{padding:10px 14px;border:0;border-radius:6px;background:#1d2f4f;color:#fff;font:inherit}
button.g{background:#e6e9ee;color:#17202e}
#e{color:#b3261e;min-height:1.3em;margin-bottom:6px}
.t{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th{background:#1d2f4f;color:#fff;padding:7px;text-align:left}
td{border:1px solid #ccc;padding:7px}
.n{text-align:right}
.av td{background:#fff3e0}
@media print{.np{display:none}th{-webkit-print-color-adjust:exact;print-color-adjust:exact}.av td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<h1>Cahier de comptes</h1>
<p class="info" id="info"></p>
<div class="np">
<input id="s" placeholder="Description">
<input id="m" type="number" inputmode="numeric" placeholder="Montant (FCFA)">
<div id="e"></div>
<div class="b">
<button onclick="add('remis')">+ Argent remis</button>
<button onclick="add('dep')">− Dépense</button>
<button class="g" onclick="add('av')">Avance (payé par moi)</button>
</div>
</div>
<div class="t"><table>
<thead><tr><th>N°</th><th>Date</th><th>Description</th><th class="n">Montant</th><th class="n">Reste</th><th class="np"></th></tr></thead>
<tbody id="r"></tbody></table></div>
<div class="b np" style="margin-top:12px">
<button onclick="window.print()">Exporter en PDF</button>
<button class="g" onclick="cloture()">Clôturer le compte</button>
</div>
<script>
var K="cahier-simple",D;
try{D=JSON.parse(localStorage.getItem(K))}catch(x){}
if(!D)D={start:0,rows:[]};
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(x){}}
function f(n){return Number(n).toLocaleString("fr-FR")}
function calc(rows){var c=D.start,remis=0,av=0,bad=false,out=[];
 rows.forEach(function(r){var rest=null;
  if(r.t=="remis"){c+=r.m;remis+=r.m;rest=c}
  else if(r.t=="dep"){c-=r.m;rest=c;if(c<0)bad=true}
  else av+=r.m;
  out.push({r:r,rest:rest})});
 return{c:c,remis:remis,av:av,bad:bad,out:out}}
function show(){var x=calc(D.rows),h="";
 document.getElementById("info").innerHTML="Édité le "+new Date().toLocaleDateString("fr-FR")+" — Total remis : <b>"+f(x.remis)+" FCFA</b><br>Solde : <b>"+f(x.c)+" FCFA</b>"+(x.av?"<br>Avances hors caisse : "+f(x.av)+" FCFA":"");
 if(D.start>0)h+="<tr><td></td><td></td><td>Solde à nouveau</td><td class='n'>"+f(D.start)+"</td><td class='n'>"+f(D.start)+"</td><td class='np'></td></tr>";
 x.out.forEach(function(o,i){var r=o.r;
  h+="<tr class='"+(r.t=="av"?"av":"")+"'><td>"+(i+1)+"</td><td>"+r.d+"</td><td></td><td class='n'>"+f(r.m)+"</td><td class='n'>"+(o.rest===null?"—":f(o.rest))+"</td><td class='np'><button class='g' onclick='del("+i+")'>✕</button></td></tr>"});
 var tb=document.getElementById("r");tb.innerHTML=h;
 var tds=tb.querySelectorAll("tr");var k=D.start>0?1:0;
 D.rows.forEach(function(r,i){tds[i+k].children[2].textContent=r.s+(r.t=="av"?" (avance)":"")})}
function add(t){var s=document.getElementById("s").value.trim(),m=Math.round(Number(document.getElementById("m").value)),e=document.getElementById("e");
 e.textContent="";
 if(!s||!(m>0)){e.textContent="Remplis la description et le montant.";return}
 var row={t:t,s:s,m:m,d:new Date().toLocaleDateString("fr-FR")};
 if(calc(D.rows.concat([row])).bad){e.textContent="Caisse insuffisante : il reste "+f(calc(D.rows).c)+" FCFA. Utilise « Avance » si tu paies toi-même.";return}
 D.rows.push(row);save();document.getElementById("s").value="";document.getElementById("m").value="";show()}
function del(i){var rows=D.rows.filter(function(_,k){return k!=i});
 if(calc(rows).bad){document.getElementById("e").textContent="Suppression impossible : la caisse serait négative.";return}
 D.rows=rows;save();show()}
function cloture(){var c=calc(D.rows).c;
 if(!confirm("Clôturer ? Exporte d'abord le PDF. Le solde de "+f(c)+" FCFA deviendra le solde à nouveau."))return;
 D={start:c,rows:[]};save();show()}
show();
</script>
</body>
</html>
